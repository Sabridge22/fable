version: '3.8'

services:
  db:
    image: postgres:17
    container_name: ${DB_CONTAINER_NAME:-fade_chat_db}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-chatdb}
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: ${APP_CONTAINER_NAME:-fade_chat_app}
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
